<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전체 브리핑 · News</title><link rel="stylesheet" href="library.css"><script defer src="library.js"></script></head><body>
<header><nav aria-label="뉴스 탐색"><a class="brand" href="/news/">NEWS<span>BRIEFING ARCHIVE</span></a><div><a href="/news/">최신 브리핑</a><a href="/news/?archive=1">날짜별 보기</a><a href="./" aria-current="page">전체 브리핑</a></div></nav></header>
<main><section class="intro"><p class="eyebrow">THE BRIEFING LIBRARY</p><h1>전체 브리핑</h1><p class="subtitle">뉴스와 GeekNews, 날짜를 넘어 한곳에서 찾아보세요.</p><p id="totals" class="totals">브리핑 목록을 불러오는 중…</p></section>

<footer>브리핑에 게재된 뉴스와 GeekNews만 검색합니다. 각 날짜의 최신 수정본을 기준으로 합니다.</footer></main></body></html>
